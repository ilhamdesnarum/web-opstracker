<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Operational Tracker & Analytics System</title>
  
  <!-- CSS Framework & Utilities -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="/logo.png">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    html, body { 
      width: 100%; 
      height: 100%; 
      height: 100dvh; 
      margin: 0; 
      padding: 0; 
      background-color: #f8fafc; 
      overflow: hidden; 
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    /* Skala Font Halus untuk HP agar tidak tampak kebesaran / bulky */
    @media (max-width: 768px) {
      html {
        font-size: 13.5px;
      }
    }
    @media (max-width: 380px) {
      html {
        font-size: 12.5px;
      }
    }
    #root { height: 100%; width: 100%; }
    body { font-family: 'Inter', sans-serif; }
    @media (min-width: 1024px) { body { zoom: 0.9; } }
    .sidebar-active { background-color: #2563eb; color: white; border-left: 4px solid #22d3ee; }
    ::-webkit-scrollbar { width: 5px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .page-enter { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-dropdown { animation: dropdownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: top; }
    @keyframes dropdownIn { from { opacity: 0; transform: scale(0.95) translateY(-5px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .animate-fade { animation: fadeInOverlay 0.3s ease-out forwards; }
    @keyframes fadeInOverlay { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(4px); } }
    .animate-modal { animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .org-tree { display: flex; justify-content: center; }
    .org-tree ul { padding-top: 30px; position: relative; display: flex; justify-content: center; margin: 0; padding-left: 0; }
    .org-tree li { text-align: center; list-style-type: none; position: relative; padding: 30px 12px 0 12px; }
    .org-tree li::before, .org-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #cbd5e1; width: 50%; height: 30px; }
    .org-tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
    .org-tree li:only-child::after, .org-tree li:only-child::before { display: none; }
    .org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
    .org-tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 6px 0 0; }
    .org-tree li:first-child::after { border-radius: 6px 0 0 0; }
    .org-tree ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #cbd5e1; width: 0; height: 30px; transform: translateX(-1px); }
    .org-tree ul:first-child::before { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

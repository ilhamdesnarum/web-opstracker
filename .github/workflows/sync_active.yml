name: 2. Sync Pelanggan Aktif (Massal)

on:
  schedule:
    # Berjalan OTOMATIS SETIAP HARI pada jam 02:00 Dini Hari WIB (19:00 UTC)
    - cron: '0 19 * * *'

  # Bisa dipicu manual kapan saja (Bisa pilih stasiun tertentu atau ALL)
  workflow_dispatch:
    inputs:
      stations:
        description: 'Pilih Stasiun (Pilih ALL untuk seluruh 11 stasiun)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - 'ALL'
          - 'Wadu'
          - 'Randublatung'
          - 'Sulur'
          - 'Kradenan'
          - 'Brumbung'
          - 'Alastua'
          - 'Tawang'
          - 'Kaliwungu'
          - 'Kalibodri'
          - 'Weleri'
          - 'Krengseng'

jobs:
  determine-stations:
    name: Setup Target Stasiun
    runs-on: ubuntu-latest
    outputs:
      stations: ${{ steps.set-stations.outputs.stations }}
    steps:
      - id: set-stations
        run: |
          INPUT_STATION="${{ inputs.stations || 'ALL' }}"
          if [ "$INPUT_STATION" = "ALL" ]; then
            echo 'stations=["Wadu", "Randublatung", "Sulur", "Kradenan", "Brumbung", "Alastua", "Tawang", "Kaliwungu", "Kalibodri", "Weleri", "Krengseng"]' >> $GITHUB_OUTPUT
          else
            echo "stations=[\"$INPUT_STATION\"]" >> $GITHUB_OUTPUT
          fi

  sync-active-parallel:
    name: Sync ${{ matrix.station }}
    needs: determine-stations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # Dibatasi 1 runner agar server Starlite tidak overload/timeout
      matrix:
        station: ${{ fromJson(needs.determine-stations.outputs.stations) }}
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan Sinkronisasi Pelanggan Aktif (${{ matrix.station }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STARLITE_PARTNER_TOKEN: ${{ secrets.STARLITE_PARTNER_TOKEN }}
          STARLITE_PARTNER_COOKIE: ${{ secrets.STARLITE_PARTNER_COOKIE }}
          SYNC_STATIONS: ${{ matrix.station }}
        run: node scripts/sync_active.js

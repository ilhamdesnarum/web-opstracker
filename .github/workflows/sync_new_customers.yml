name: 3. Sync Pelanggan Baru (Otomatis Tiap Jam)

on:
  schedule:
    # Berjalan OTOMATIS SETIAP JAM (pada menit ke-0)
    # Repositori Public: Kuota Actions Unlimited & Gratis
    - cron: '0 * * * *'

  # Bisa dipicu manual kapan saja dari tab GitHub Actions
  workflow_dispatch:
    inputs:
      stations:
        description: 'Pilih Stasiun (Pilih ALL untuk seluruh 11 stasiun)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - 'ALL'
          - 'Wadu'
          - 'Randublatung'
          - 'Sulur'
          - 'Kradenan'
          - 'Brumbung'
          - 'Alastua'
          - 'Tawang'
          - 'Kaliwungu'
          - 'Kalibodri'
          - 'Weleri'
          - 'Krengseng'

jobs:
  sync-new-customers:
    name: Sync Pelanggan Baru (${{ inputs.stations || 'ALL' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan Sinkronisasi Pelanggan Baru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STARLITE_PARTNER_TOKEN: ${{ secrets.STARLITE_PARTNER_TOKEN }}
          STARLITE_PARTNER_COOKIE: ${{ secrets.STARLITE_PARTNER_COOKIE }}
          SYNC_STATIONS: ${{ inputs.stations || 'ALL' }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node scripts/sync_new_customers.js

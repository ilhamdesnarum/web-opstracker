name: 1. Sync Due Date & Suspend (Cepat ~30s)

on:
  # Berjalan otomatis setiap 2 jam sekali
  schedule:
    - cron: '0 */2 * * *'

  # Bisa dipicu manual kapan saja
  workflow_dispatch:

jobs:
  sync-due-date:
    name: Sync Due Date & Suspend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment

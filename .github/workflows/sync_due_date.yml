name: 1. Sync Due Date & Suspend (Cepat ~30s)

on:
  schedule:
    # Berjalan OTOMATIS SETIAP 3 JAM (pada menit ke-15)
    # Menarik pelanggan Suspend, Dismantle & Due Date secara rutin agar data selalu lurus dengan web partner
    - cron: '15 */3 * * *'

  workflow_dispatch:

jobs:
  sync-due-date:
    name: Sync Due Date & Suspend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan Sync Due Date & Suspend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STARLITE_PARTNER_TOKEN: ${{ secrets.STARLITE_PARTNER_TOKEN }}
          STARLITE_PARTNER_COOKIE: ${{ secrets.STARLITE_PARTNER_COOKIE }}
        run: node scripts/sync_due_date.js

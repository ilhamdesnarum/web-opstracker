name: Sinkronisasi Partner Starlite ke Supabase

on:
  # 1. Penjadwalan Otomatis (Cron Job)
  # Berjalan otomatis setiap 6 jam sekali (Jam 00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 0,6,12,18 * * *'

  # 2. Trigger Manual (Bisa dipicu kapan saja dari Web GitHub / Mobile App)
  workflow_dispatch:
    inputs:
      statuses:
        description: 'Pilih status data yang ingin ditarik'
        required: true
        default: 'active,suspend,dismantle,ready-to-dismantle'
        type: choice
        options:
          - 'active,suspend,dismantle,ready-to-dismantle'
          - 'suspend,dismantle,ready-to-dismantle'
          - 'active'
          - 'suspend'

jobs:
  sync:
    name: Sync Starlite Partner Data
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Batas waktu hingga 60 menit (Sangat aman untuk 20.000+ data)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Jalankan Sinkronisasi Partner ke Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://jtmferyskpbnacluyafs.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0bWZlcnlza3BibmFjbHV5YWZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTkxNjksImV4cCI6MjEwMjY5NTE2OX0.QCtYEUipE1wBBQ7hy1wbNu2L7T7P5v4pKqkVEu221Jw' }}
          STARLITE_PARTNER_TOKEN: ${{ secrets.STARLITE_PARTNER_TOKEN || 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..AIeceSlBn_Xe4CRtLZ8IIUqWwn2T3fZOjc-Ybq_gKsM' }}
          STARLITE_PARTNER_COOKIE: ${{ secrets.STARLITE_PARTNER_COOKIE || '_ga=GA1.1.1000327763.1779010726; _gcl_au=1.1.1451051866.1779010727; _fbp=fb.1.1779010726946.118555004272738158; _tt_enable_cookie=1; _ttp=01KRTMTV531SKYMHFWWT9XR4DH_.tt.1; _ga_DFWC1L1VBM=GS2.1.s1782135322$o6$g0$t1782135322$j60$l0$h0; ttcsid=1782135322245::M649s3W_u5vulwz81TSP.5.1782135323124.0::1.-2031.0::0.0.0.0::0.0.0; ttcsid_D6N6GJRC77U5VG9U4DSG=1782135322245::WsZdqWnprfIDO3deWfQF.5.1782135323125.0; _ga_1ST28GMNXL=GS2.1.s1782207506$o7$g0$t1782207506$j60$l0$h0; token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..AIeceSlBn_Xe4CRtLZ8IIUqWwn2T3fZOjc-Ybq_gKsM' }}
          SYNC_STATUSES: ${{ github.event.inputs.statuses || 'active,suspend,dismantle,ready-to-dismantle' }}
        run: node scripts/sync_partner.js
